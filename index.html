
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Bé chọn đúng số lượng</title>

<style>
:root {
  --ink: #24458b;
  --pink: #ff5c9a;
  --blue: #38a8e8;
  --green: #53bb72;
  --purple: #a779e8;
  --orange: #ffb83e;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
}

body {
  font-family: "Trebuchet MS", Arial, sans-serif;
  color: var(--ink);
  background: linear-gradient(180deg, #dff5ff, #f3ffe8);
  overflow-x: hidden;
}

button {
  font-family: inherit;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
}

.game {
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 8px 10px 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* Tiêu đề và nút */
.topbar {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

h1 {
  margin: 0;
  text-align: center;
  font-size: clamp(22px, 2.5vw, 36px);
  line-height: 1.15;
  color: #f34d91;
  text-shadow: 1px 2px white;
}

.controls {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

.btn {
  border: 2px solid white;
  border-radius: 15px;
  padding: 9px 14px;
  font-size: clamp(13px, 1.3vw, 18px);
  font-weight: 900;
  color: white;
  box-shadow: 0 3px 0 rgba(36, 69, 139, .15);
  white-space: nowrap;
}

.btn-restart {
  background: var(--purple);
}

.btn-next {
  background: var(--pink);
}

.btn:disabled {
  opacity: .45;
  cursor: not-allowed;
}

/* Khung số mục tiêu */
.middle {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-shrink: 0;
}

.target {
  width: min(100%, 460px);
  height: clamp(185px, 27vh, 275px);
  border: 8px solid #ffbf27;
  border-radius: 32px;
  background: #fff;
  box-shadow:
    inset 0 0 0 5px #fff0b8,
    0 6px 0 #f6dc87;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 8px;
}

#targetNumber {
  color: #3551bd;
  font-size: clamp(125px, 15vw, 205px);
  font-weight: 900;
  line-height: 1;
  text-shadow: 3px 4px #d5ddff;
}

/* Điểm và lượt chơi */
.status {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-shrink: 0;
}

.pill {
  background: white;
  border: 2px solid #b9e7ff;
  border-radius: 999px;
  padding: 7px 17px;
  font-size: clamp(14px, 1.5vw, 19px);
  font-weight: 900;
  box-shadow: 0 2px 5px #b8dcef;
}

/* Phản hồi */
.feedback {
  order: 1;
  min-height: 26px;
  text-align: center;
  font-size: clamp(16px, 1.8vw, 24px);
  font-weight: 900;
  line-height: 1.2;
  color: #269b53;
  flex-shrink: 0;
}

.feedback.error {
  color: #ef4c7d;
}

/* 5 khung hình: bo tròn 4 góc, cách mép dưới 12px */
.choices {
  order: 2;
  width: min(100%, 1350px);
  height: clamp(230px, 40vh, 365px);
  margin: auto auto 12px;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: clamp(8px, 1vw, 14px);
  align-items: stretch;
  flex-shrink: 0;
}

.choice {
  min-width: 0;
  min-height: 0;
  border: 5px solid var(--card-color, #38a8e8);
  border-radius: 22px;
  background: #fff;
  box-shadow: inset 0 0 0 3px var(--soft-color, #e7f7ff);
  padding: 7px;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  transition: transform .15s, background .15s;
}

.choice:hover:not(:disabled) {
  transform: translateY(-3px);
}

.choice:focus-visible,
.btn:focus-visible {
  outline: 4px solid #24458b;
  outline-offset: 2px;
}

.choice.correct {
  background: #e8ffed;
  border-color: #28aa5a;
  box-shadow: inset 0 0 0 3px #c7f6d3;
}

.choice.wrong {
  background: #fff0f4;
  border-color: #ff5c8b;
}

/* Hình lớn và rõ */
.picture {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: repeat(3, minmax(0, 1fr));
  align-content: center;
  justify-items: center;
  align-items: center;
  gap: 0;
}

.emoji {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: clamp(36px, 4vw, 60px);
  line-height: 1;
  text-align: center;
  filter: drop-shadow(0 2px 1px #ddd);
}

/* Hộp kết quả */
.modal {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(24, 43, 85, .5);
}

.modal.show {
  display: flex;
}

.modal-card {
  width: min(100%, 460px);
  padding: 25px 20px;
  border: 5px solid #ffbf27;
  border-radius: 28px;
  background: white;
  text-align: center;
}

.modal-card h2 {
  margin: 0 0 12px;
  color: #f34d91;
  font-size: clamp(26px, 4vw, 38px);
}

.modal-card p {
  font-size: 22px;
  font-weight: 900;
  line-height: 1.4;
}

/* Màn hình máy tính thấp */
@media (max-height: 760px) and (min-width: 601px) {
  .game {
    gap: 5px;
    padding: 6px 8px 0;
  }

  .target {
    height: clamp(150px, 23vh, 205px);
  }

  #targetNumber {
    font-size: clamp(115px, 12vw, 165px);
  }

  .choices {
    height: clamp(205px, 38vh, 290px);
  }

  .emoji {
    font-size: clamp(32px, 3.5vw, 49px);
  }

  .pill {
    padding: 5px 14px;
  }

  .feedback {
    min-height: 22px;
  }
}

/* Điện thoại */
@media (max-width: 600px) {
  .game {
    min-height: 100vh;
    min-height: 100dvh;
    padding: 6px 6px 0;
    gap: 6px;
  }

  .topbar {
    grid-template-columns: 1fr;
    gap: 5px;
  }

  h1 {
    font-size: clamp(21px, 5.5vw, 29px);
  }

  .controls {
    justify-content: center;
    gap: 8px;
  }

  .btn {
    padding: 7px 12px;
    font-size: 14px;
    border-radius: 12px;
  }

  .target {
    width: min(100%, 300px);
    height: clamp(150px, 21vh, 190px);
    border-width: 6px;
    border-radius: 24px;
  }

  #targetNumber {
    font-size: clamp(115px, 28vw, 155px);
  }

  .status {
    gap: 7px;
  }

  .pill {
    padding: 5px 12px;
    font-size: 13px;
  }

  /* 3 khung trên, 2 khung dưới */
  .choices {
    width: 100%;
    height: clamp(300px, 44vh, 410px);
    grid-template-columns: repeat(6, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));
    gap: 7px;
  }

  .choice {
    grid-column: span 2;
    border-width: 4px;
    border-radius: 18px;
    padding: 3px;
  }

  .choice:nth-child(4) {
    grid-column: 2 / span 2;
  }

  .choice:nth-child(5) {
    grid-column: 4 / span 2;
  }

  .picture {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(3, minmax(0, 1fr));
  }

  .emoji {
    font-size: clamp(28px, 8vw, 44px);
  }

  .feedback {
    min-height: 22px;
    font-size: clamp(14px, 4vw, 19px);
  }
}

/* Điện thoại rất nhỏ */
@media (max-width: 380px) {
  .game {
    padding: 4px 4px 0;
    gap: 5px;
  }

  .target {
    height: 135px;
  }

  #targetNumber {
    font-size: 110px;
  }

  .choices {
    height: 285px;
    gap: 5px;
  }

  .choice {
    border-width: 3px;
    border-radius: 15px;
    padding: 2px;
  }

  .emoji {
    font-size: clamp(24px, 7.5vw, 33px);
  }
}

/* Điện thoại nằm ngang */
@media (max-height: 570px) and (max-width: 900px) {
  .game {
    gap: 4px;
    padding: 4px 4px 0;
  }

  .topbar {
    grid-template-columns: 1fr auto;
  }

  h1 {
    font-size: 19px;
  }

  .btn {
    padding: 5px 8px;
    font-size: 12px;
  }

  .target {
    height: 95px;
    width: 180px;
    border-width: 4px;
    border-radius: 16px;
  }

  #targetNumber {
    font-size: 75px;
  }

  .choices {
    height: 190px;
    gap: 5px;
  }

  .choice {
    padding: 2px;
    border-radius: 15px;
  }

  .emoji {
    font-size: clamp(20px, 5vh, 31px);
  }

  .feedback {
    min-height: 18px;
    font-size: 14px;
  }
}
</style>
</head>

<body>
<div class="game">

  <header class="topbar">
    <h1>🌈 Bé chọn đúng số lượng 🌈</h1>

    <div class="controls">
      <button class="btn btn-restart" id="restartBtn">
        🔄 Chơi lại
      </button>

      <button class="btn btn-next" id="nextBtn" disabled>
        ➡️ Câu tiếp
      </button>
    </div>
  </header>

  <section class="middle">
    <div class="target">
      <div id="targetNumber" aria-live="polite">3</div>
    </div>
  </section>

  <div class="status">
    <div class="pill" id="roundText">⭐ Lượt: 1/5</div>
    <div class="pill" id="scoreText">🏆 Điểm: 0</div>
  </div>

  <div class="feedback" id="feedback" aria-live="polite"></div>

  <section class="choices" id="choices"
           aria-label="Các nhóm hình"></section>
</div>

<div class="modal" id="resultModal"
     role="dialog" aria-modal="true">

  <div class="modal-card">
    <h2>🎉 Chúc mừng bé! 🎉</h2>
    <p id="resultMessage"></p>

    <button class="btn btn-restart" id="playAgainBtn">
      🔄 Chơi lại nhé!
    </button>
  </div>
</div>

<audio id="winAudio" src="win.mp3" preload="auto"></audio>
<audio id="wrongAudio" src="sai.mp3" preload="auto"></audio>

<script>
const groups = [
  {
    count: 3,
    emoji: "⭐",
    name: "Ngôi sao",
    color: "#38a8e8",
    soft: "#e5f7ff"
  },
  {
    count: 4,
    emoji: "🦋",
    name: "Con bướm",
    color: "#ffb83e",
    soft: "#fff2d9"
  },
  {
    count: 5,
    emoji: "🌸",
    name: "Bông hoa",
    color: "#a779e8",
    soft: "#f1e8ff"
  },
  {
    count: 6,
    emoji: "🐠",
    name: "Con cá",
    color: "#53bb72",
    soft: "#e4f9e8"
  },
  {
    count: 7,
    emoji: "🍎",
    name: "Quả táo",
    color: "#ff5c9a",
    soft: "#ffe7f0"
  }
];

const targetNumber = document.getElementById("targetNumber");
const choicesEl = document.getElementById("choices");
const roundText = document.getElementById("roundText");
const scoreText = document.getElementById("scoreText");
const feedback = document.getElementById("feedback");
const nextBtn = document.getElementById("nextBtn");
const restartBtn = document.getElementById("restartBtn");
const resultModal = document.getElementById("resultModal");
const resultMessage = document.getElementById("resultMessage");
const playAgainBtn = document.getElementById("playAgainBtn");
const winAudio = document.getElementById("winAudio");
const wrongAudio = document.getElementById("wrongAudio");

let round = 0;
let score = 0;
let targets = [];
let currentTarget = null;
let answered = false;

function shuffle(array) {
  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

function playSound(audio) {
  audio.currentTime = 0;
  const promise = audio.play();

  if (promise && promise.catch) {
    promise.catch(() => {});
  }
}

function updateStatus() {
  roundText.textContent =
    `⭐ Lượt: ${Math.min(round + 1, 5)}/5`;

  scoreText.textContent = `🏆 Điểm: ${score}`;
}

function renderChoices() {
  choicesEl.innerHTML = "";

  shuffle(groups).forEach(group => {
    const card = document.createElement("button");

    card.type = "button";
    card.className = "choice";
    card.style.setProperty("--card-color", group.color);
    card.style.setProperty("--soft-color", group.soft);
    card.style.setProperty("--shadow-color", group.soft);

    card.setAttribute(
      "aria-label",
      `Nhóm có ${group.count} hình`
    );

    const picture = document.createElement("div");
    picture.className = "picture";

    for (let i = 0; i < group.count; i++) {
      const item = document.createElement("span");

      item.className = "emoji";
      item.textContent = group.emoji;
      item.setAttribute("aria-hidden", "true");

      picture.appendChild(item);
    }

    card.appendChild(picture);

    card.addEventListener("click", () => {
      checkAnswer(card, group.count);
    });

    choicesEl.appendChild(card);
  });
}

function startRound() {
  if (round >= 5) {
    finishGame();
    return;
  }

  currentTarget = targets[round];
  answered = false;

  targetNumber.textContent = currentTarget;
  feedback.textContent = "";
  feedback.classList.remove("error");

  nextBtn.disabled = true;
  nextBtn.textContent = "➡️ Câu tiếp";

  renderChoices();
  updateStatus();
}

function checkAnswer(card, selectedCount) {
  if (answered) return;

  if (selectedCount === currentTarget) {
    answered = true;
    score++;

    card.classList.add("correct");

    document.querySelectorAll(".choice").forEach(button => {
      button.disabled = true;
    });

    feedback.textContent = "🎉 Chính xác! Con giỏi quá!";
    feedback.classList.remove("error");

    playSound(winAudio);

    nextBtn.disabled = false;
    nextBtn.textContent =
      round === 4 ? "🏁 Xem kết quả" : "➡️ Câu tiếp";

    updateStatus();

  } else {
    card.classList.remove("wrong");
    void card.offsetWidth;
    card.classList.add("wrong");

    feedback.textContent = "😊 Con thử lại nhé!";
    feedback.classList.add("error");

    playSound(wrongAudio);

    setTimeout(() => {
      card.classList.remove("wrong");
    }, 650);
  }
}

function finishGame() {
  resultMessage.textContent =
    `Bé trả lời đúng ${score}/5 câu. ` +
    (score === 5
      ? "Tuyệt vời! Bé giỏi quá! 🌟"
      : "Bé hãy chơi lại để giỏi hơn nhé! 💖");

  resultModal.classList.add("show");
  nextBtn.disabled = true;
}

function startGame() {
  round = 0;
  score = 0;
  targets = shuffle([3, 4, 5, 6, 7]);

  resultModal.classList.remove("show");
  startRound();
}

nextBtn.addEventListener("click", () => {
  if (!answered) return;

  if (round < 4) {
    round++;
    startRound();
  } else {
    round = 5;
    updateStatus();
    finishGame();
  }
});

restartBtn.addEventListener("click", startGame);
playAgainBtn.addEventListener("click", startGame);

startGame();
</script>
</body>
</html>
